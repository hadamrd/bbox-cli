version: 2

project_name: bbox-cli

before:
  hooks:
    - go mod tidy

builds:
  - id: bbox
    binary: bbox
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/hadamrd/bbox-cli/cmd.Version={{.Version}}
      - -X github.com/hadamrd/bbox-cli/cmd.Commit={{.ShortCommit}}
      - -X github.com/hadamrd/bbox-cli/cmd.BuildDate={{.Date}}

archives:
  - id: bbox
    ids:
      - bbox
    name_template: "bbox_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: Features
      regexp: '(?i)^feat(\(.+\))?:'
      order: 0
    - title: Bug fixes
      regexp: '(?i)^fix(\(.+\))?:'
      order: 1
    - title: Performance
      regexp: '(?i)^perf(\(.+\))?:'
      order: 2
    - title: Other
      order: 999

release:
  draft: false
  prerelease: auto
  footer: |
    **Full changelog**: https://github.com/hadamrd/bbox-cli/compare/{{ .PreviousTag }}...{{ .Tag }}
