version: 2

project_name: bbox-cli

before:
  hooks:
    - go mod tidy

builds:
  - id: bbox
    binary: bbox
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/hadamrd/bbox-cli/cmd.Version={{.Version}}
      - -X github.com/hadamrd/bbox-cli/cmd.Commit={{.ShortCommit}}
      - -X github.com/hadamrd/bbox-cli/cmd.BuildDate={{.Date}}

archives:
  - id: bbox
    ids:
      - bbox
    name_template: "bbox_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

dockers:
  - id: bbox-amd64
    ids:
      - bbox
    goos: linux
    goarch: amd64
    image_templates:
      - "ghcr.io/hadamrd/bbox-cli:{{ .Version }}-amd64"
      - "{{ if not .Prerelease }}ghcr.io/hadamrd/bbox-cli:latest-amd64{{ end }}"
    dockerfile: Dockerfile.goreleaser
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.source=https://github.com/hadamrd/bbox-cli"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=MIT"
  - id: bbox-arm64
    ids:
      - bbox
    goos: linux
    goarch: arm64
    image_templates:
      - "ghcr.io/hadamrd/bbox-cli:{{ .Version }}-arm64"
      - "{{ if not .Prerelease }}ghcr.io/hadamrd/bbox-cli:latest-arm64{{ end }}"
    dockerfile: Dockerfile.goreleaser
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.source=https://github.com/hadamrd/bbox-cli"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=MIT"

docker_manifests:
  - name_template: "ghcr.io/hadamrd/bbox-cli:{{ .Version }}"
    image_templates:
      - "ghcr.io/hadamrd/bbox-cli:{{ .Version }}-amd64"
      - "ghcr.io/hadamrd/bbox-cli:{{ .Version }}-arm64"
  - name_template: "{{ if not .Prerelease }}ghcr.io/hadamrd/bbox-cli:latest{{ end }}"
    image_templates:
      - "ghcr.io/hadamrd/bbox-cli:latest-amd64"
      - "ghcr.io/hadamrd/bbox-cli:latest-arm64"
    skip_push: auto

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: Features
      regexp: '(?i)^feat(\(.+\))?:'
      order: 0
    - title: Bug fixes
      regexp: '(?i)^fix(\(.+\))?:'
      order: 1
    - title: Performance
      regexp: '(?i)^perf(\(.+\))?:'
      order: 2
    - title: Other
      order: 999

release:
  draft: false
  prerelease: auto
  footer: |
    **Full changelog**: https://github.com/hadamrd/bbox-cli/compare/{{ .PreviousTag }}...{{ .Tag }}
